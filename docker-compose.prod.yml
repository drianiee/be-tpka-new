services:
  tpka_app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: tpka_app:prod
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    restart: unless-stopped
    networks:
      - tpka_shared_prod
    env_file:
      - .env.prod

networks:
  tpka_shared_prod:
    external: true
