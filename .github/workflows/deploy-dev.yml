name: Deploy dev (self-hosted)

on:
  push:
    branches: [dev]

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

jobs:
  changes:
    runs-on: self-hosted
    outputs:
      composer: ${{ steps.diff.outputs.composer }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - name: Detect changed paths
        id: diff
        run: |
          cd "$DEPLOY_PATH"
          git fetch origin dev --quiet
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          changed() {
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo true
            elif git diff --name-only "$BEFORE" "$AFTER" -- "$1" | grep -q .; then
              echo true
            else
              echo false
            fi
          }
          echo "composer=$(changed composer.lock)" >> "$GITHUB_OUTPUT"
          echo "migrations=$(changed database/migrations)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd "$DEPLOY_PATH"
          git pull origin dev

      - name: Rebuild and restart
        run: |
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.dev.yml up -d --build

      - name: Sync composer dependencies
        if: needs.changes.outputs.composer == 'true'
        run: |
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.dev.yml exec -T tpka_app composer install --no-interaction

      - name: Fix storage permissions
        run: |
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.dev.yml exec -T -u root tpka_app chmod -R a+rwX storage bootstrap/cache

  migrate:
    needs: [changes, deploy]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: self-hosted
    steps:
      - name: Run migrations
        run: |
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.dev.yml exec -T tpka_app php artisan migrate --force

  cleanup:
    needs: [deploy, migrate]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Clean up old build leftovers
        run: |
          docker image prune -f
          docker builder prune -f

  verify:
    needs: cleanup
    runs-on: self-hosted
    steps:
      - name: Check deployment status
        run: |
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.dev.yml ps

      - name: Check docker storage usage
        run: |
          docker system df
